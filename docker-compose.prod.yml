version: "3.9"

services:
  backend:
    build:
      context: ./backend

    container_name: project-inspector-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

  frontend:
    build:
      context: ./frontend

    container_name: project-inspector-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend