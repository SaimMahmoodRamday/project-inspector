version: "3.9"
services:
  backend:
    build: ./backend
    container_name: project-inspector-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: project-inspector-frontend
    ports:
      - "3000:80"
    stdin_open: true
    tty: true
