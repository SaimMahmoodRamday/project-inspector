version: "3.9"
services:
  backend:
    build: ./backend
    container_name: project-inspector-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app   # OK for dev, installed packages live in /venv so won't be overwritten
    stdin_open: true
    tty: true

  frontend:
    build: ./frontend
    container_name: project-inspector-frontend
    ports:
      - "3000:80"
    stdin_open: true
    tty: true
