server {
    listen 80;

    client_max_body_size 25M;

    # Serve React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy /upload to FastAPI backend on Azure Container Apps (HTTPS required)
    location /upload {
        proxy_pass https://project-inspector-backend.proudfield-b0f3558f.eastus.azurecontainerapps.io/upload;
        proxy_ssl_server_name on;
        proxy_set_header Host project-inspector-backend.proudfield-b0f3558f.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for AI analysis
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
    }

    # Proxy /static (SVG call graphs) to FastAPI backend
    location /static {
        proxy_pass https://project-inspector-backend.proudfield-b0f3558f.eastus.azurecontainerapps.io/static;
        proxy_ssl_server_name on;
        proxy_set_header Host project-inspector-backend.proudfield-b0f3558f.eastus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}